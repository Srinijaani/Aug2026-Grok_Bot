name: Chip Intel Briefing

on:
  workflow_dispatch:
  schedule:
    # Weekly Monday 09:00 UTC
    - cron: "0 9 * * 1"

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate and email briefing
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          export SMTP_HOST="${SMTP_HOST:-smtp.gmail.com}"
          export SMTP_PORT="${SMTP_PORT:-587}"
          export EMAIL_TO="${EMAIL_TO:-sriniwas.gattani@gmail.com}"
          python run_briefing.py
      - name: Upload PDF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chip-briefing-pdf
          path: output/chip_briefing.pdf
          if-no-files-found: warn
